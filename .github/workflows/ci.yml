name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: kit.json schema
        run: node scripts/check-schema.mjs
      - name: Vendored shared files and schema copy are current
        run: node scripts/vendor-shared.mjs --check
      - name: Unit tests
        run: npm test
      - name: Docs parity (name.md / name.uk.md)
        run: node plugins/core/bin/kit-docs-parity
      - name: No version field in plugin manifests
        run: |
          if grep -l '"version"' plugins/*/.claude-plugin/plugin.json; then
            echo "plugin.json must not set version: the stable tag is the release" >&2
            exit 1
          fi
