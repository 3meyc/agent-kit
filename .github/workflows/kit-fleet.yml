name: kit-fleet

# Reusable weekly fleet check (docs/using.md § 5). A private repo, usually an overlay kit, calls it
# on a schedule with its own repo list and a read token; this public repo holds no list and never
# runs it, so no repo name reaches a public log. The job runs `agent-kit fleet --source github` at
# `kit-ref`, writes the report to the run summary and an artifact, and keeps one rolling issue in
# the calling repo: opened or updated while there are findings, closed when a run is clean.
#
# Caller:
#
#   on:
#     schedule: [{ cron: "0 6 * * 1" }]
#     workflow_dispatch:
#   permissions: { contents: read, issues: write }
#   jobs:
#     fleet:
#       uses: 3meyc/agent-kit/.github/workflows/kit-fleet.yml@stable
#       with: { repo-list: .github/kit-fleet.json }
#       secrets: { fleet-token: "${{ secrets.KIT_FLEET_TOKEN }}" }

on:
  workflow_call:
    inputs:
      repo-list:
        description: Path of the JSON repo list in the calling repo (the `kit fleet --list` file).
        required: true
        type: string
      kit-ref:
        description: The agent-kit ref whose `fleet` command runs.
        type: string
        default: stable
      issue-title:
        description: Title of the rolling issue.
        type: string
        default: Kit fleet check
      issue-label:
        description: Label that marks the rolling issue; created when missing.
        type: string
        default: kit-fleet
      fail-on-findings:
        description: Fail the run on findings too (the rolling issue reports them either way).
        type: boolean
        default: false
    secrets:
      fleet-token:
        description: A token that can read the contents of every listed repo and kit.
        required: false
    outputs:
      findings:
        description: "1 when the check found something, 0 when clean."
        value: ${{ jobs.fleet.outputs.findings }}

permissions:
  contents: read
  issues: write

jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: kit-fleet-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    outputs:
      findings: ${{ steps.fleet.outputs.findings }}
    steps:
      - name: Check the read token
        env:
          FLEET_TOKEN: ${{ secrets.fleet-token }}
        run: |
          if [ -z "$FLEET_TOKEN" ]; then
            echo "::error title=kit-fleet: secret missing::The fleet-token secret is empty. Add a repository secret with a token that can read every listed repo and kit, and pass it as fleet-token (docs/using.md § 5). Nothing was checked."
            exit 1
          fi

      - name: Check out the calling repo (for its repo list)
        uses: actions/checkout@v4
        with:
          path: caller
          persist-credentials: false

      - name: Check out agent-kit at ${{ inputs.kit-ref }}
        uses: actions/checkout@v4
        with:
          repository: 3meyc/agent-kit
          ref: ${{ inputs.kit-ref }}
          path: .agent-kit
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run kit fleet
        id: fleet
        env:
          GH_TOKEN: ${{ secrets.fleet-token }}
          LIST: caller/${{ inputs.repo-list }}
        run: |
          set +e
          node .agent-kit/bin/agent-kit.mjs fleet --source github --list "$LIST" --out fleet-out > /dev/null
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            echo "::error title=kit-fleet::agent-kit fleet stopped with exit code $code (see the log above); the rolling issue was not touched."
            exit "$code"
          fi
          echo "findings=$code" >> "$GITHUB_OUTPUT"
          cat fleet-out/fleet.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        uses: actions/upload-artifact@v4
        with:
          name: kit-fleet-report
          path: fleet-out/
          retention-days: 30

      - name: Update the rolling issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FINDINGS: ${{ steps.fleet.outputs.findings }}
          TITLE: ${{ inputs.issue-title }}
          LABEL: ${{ inputs.issue-label }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ "$FINDINGS" = "1" ]; then
            gh label create "$LABEL" --description "Weekly kit fleet check" --color D93F0B --force > /dev/null
            {
              echo "Updated by [kit-fleet run]($RUN_URL). This issue closes itself when a run is clean."
              echo
              head -c 60000 fleet-out/fleet.md
            } > issue.md
            if [ -n "$number" ]; then
              gh issue edit "$number" --title "$TITLE" --body-file issue.md
              gh issue comment "$number" --body "Still open after the [run of $(date -u +%F)]($RUN_URL); the description holds the current report."
            else
              gh issue create --title "$TITLE" --label "$LABEL" --body-file issue.md
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "Clean on $(date -u +%F) ([run]($RUN_URL)); closing."
            gh issue close "$number"
          else
            echo "No findings and no open issue."
          fi

      - name: Fail on findings
        if: inputs.fail-on-findings && steps.fleet.outputs.findings == '1'
        run: |
          echo "::error title=kit-fleet::findings reported in the rolling issue"
          exit 1
